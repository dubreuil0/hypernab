<!doctype html>
<html lang="tr"><head><meta charset="utf-8"><title>Hypernab</title><link rel="stylesheet" href="download-prompt.css"></head>
<body>
<main id="card" hidden>
  <div class="file"><img src="icons/icon-48.png" alt=""><div class="info"><strong id="name"></strong><span id="meta"></span></div></div>
  <div class="where"><span>Kayıt yeri</span><span id="directory"></span></div>
  <p id="risk" class="notice warn" hidden></p>
  <p id="duplicate" class="notice" hidden>Bu bağlantı Hypernab listesinde zaten var.</p>
  <p id="message" class="notice error" role="alert" hidden></p>
  <label class="check" id="remember"><input type="checkbox" id="remember-type"> <span id="remember-type-text">Bu dosya türünü bir daha sorma</span></label>
  <div class="actions">
    <span id="queue-note"></span>
    <button id="browser" hidden>Tarayıcı ile indir</button>
    <button id="cancel">İptal</button>
    <button id="later">Sonra</button>
    <button id="now" class="primary" autofocus>İndir</button>
  </div>
</main>
<p id="done" class="done" role="status" hidden></p>
<script src="download-prompt.js"></script>
</body></html>
